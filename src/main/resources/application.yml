# 기본값은 H2 메모리 모드.
# 운영 환경은 DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER_CLASS, JPA_DIALECT로 교체.
# .env 또는 환경변수로 주입하는 것을 권장합니다.

spring:
  application:
    name: kotlin-payment-core-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:payment_core;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER_CLASS:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: info
    com.sugowslt.paymentcoreapi: debug

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:local}
    toss:
      base-url: ${TOSS_PAYMENT_BASE_URL:https://api.tosspayments.com}
      secret-key: ${TOSS_PAYMENT_SECRET_KEY:}
      connect-timeout-ms: ${TOSS_PAYMENT_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${TOSS_PAYMENT_READ_TIMEOUT_MS:3000}
      max-retries: ${TOSS_PAYMENT_MAX_RETRIES:1}
  webhook:
    # 로컬 대시보드 확인용 기본값입니다. 운영 환경에서는 반드시 환경변수로 교체합니다.
    replay-token: ${PAYMENT_WEBHOOK_REPLAY_TOKEN:local-dashboard-replay-token}
  outbox:
    max-retries: ${PAYMENT_OUTBOX_MAX_RETRIES:3}
    retry-delay-seconds: ${PAYMENT_OUTBOX_RETRY_DELAY_SECONDS:30}
