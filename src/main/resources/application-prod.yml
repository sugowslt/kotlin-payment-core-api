spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
  flyway:
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration/mysql}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:toss}
  webhook:
    # 운영에서는 반드시 환경변수로 주입하고, 로컬 기본 token을 사용하지 않습니다.
    replay-token: ${PAYMENT_WEBHOOK_REPLAY_TOKEN:}
  outbox:
    worker:
      enabled: ${PAYMENT_OUTBOX_WORKER_ENABLED:true}
  idempotency:
    redis:
      enabled: ${PAYMENT_IDEMPOTENCY_REDIS_ENABLED:true}
      ttl-seconds: ${PAYMENT_IDEMPOTENCY_REDIS_TTL_SECONDS:30}
  settlement:
    fee-rate-bps: ${PAYMENT_SETTLEMENT_FEE_RATE_BPS:300}
