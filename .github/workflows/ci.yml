name: CI
run-name: ${{ github.actor }} / ${{ github.workflow }}
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew build -x test --warning-mode none
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  test-h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew test --warning-mode none

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: payment_core
          MYSQL_USER: payment
          MYSQL_PASSWORD: payment-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: "jdbc:mysql://127.0.0.1:3306/payment_core?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: payment
      DB_PASSWORD: payment-password
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      JPA_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration/mysql
      PAYMENT_GATEWAY_PROVIDER: local
      PAYMENT_WEBHOOK_REPLAY_TOKEN: ci-test-token
      PAYMENT_OUTBOX_WORKER_ENABLED: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew test --warning-mode none

  local-tooling-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --check scripts/load-test.mjs
      - run: docker compose config --quiet
